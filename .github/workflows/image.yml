# Publishes the image oydeu/dpp-service from this repository, so that running
# the DPP Service with Docker is a pull and not a build (docs/Standalone.md).
#
# Every snapshot arrives here as one release commit on main; that push builds
# the image from exactly the files of the snapshot. The image therefore holds
# what this repository holds, and GET /version names the commit of this
# repository it was built from.
#
# Two architectures: amd64 for servers, arm64 for Apple silicon. The arm64 half
# is built under emulation and takes a while.
name: Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as, next to :latest (default: date of the commit, e.g. 261028, then 261028b, 261028c ...). An existing tag is never overwritten."
        required: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest and one tag of its own, so an installation can pin an image.
      # The tag is the date of the commit (UTC), YYMMDD, for the first snapshot
      # of a day, then YYMMDDb, YYMMDDc ... A tag that exists on Docker Hub is
      # never pushed again: an image pinned by its tag stays the image it was.
      # A given tag that exists already stops the run. Only "not found" counts
      # as free; any other answer of the registry stops the run as well.
      - name: Work out the tags
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          state() {
            if out="$(docker buildx imagetools inspect "oydeu/dpp-service:$1" 2>&1)"; then
              echo taken
            elif printf '%s' "$out" | grep -qi "not found"; then
              echo free
            else
              printf 'cannot tell whether oydeu/dpp-service:%s exists:\n%s\n' "$1" "$out" >&2
              echo unknown
            fi
          }
          if [ -n "$INPUT_TAG" ]; then
            case "$INPUT_TAG" in
              *[!A-Za-z0-9._-]*|latest) echo "unusable tag: $INPUT_TAG" >&2; exit 1 ;;
            esac
            candidates="$INPUT_TAG"
          else
            day="$(TZ=UTC git log -1 --format=%cd --date=format-local:%y%m%d)"
            candidates="$day"
            for suffix in b c d e f g h i j k l m n o p q r s t u v w x y z; do candidates="$candidates $day$suffix"; done
          fi
          tag=""
          for candidate in $candidates; do
            case "$(state "$candidate")" in
              free) tag="$candidate"; break ;;
              taken) [ -n "$INPUT_TAG" ] && { echo "oydeu/dpp-service:$candidate exists already; tags are never overwritten" >&2; exit 1; } ;;
              *) exit 1 ;;
            esac
          done
          if [ -z "$tag" ]; then echo "no free tag left among: $candidates" >&2; exit 1; fi
          echo "publishing as oydeu/dpp-service:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tags=oydeu/dpp-service:latest,oydeu/dpp-service:$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DPP_IMAGE_TAG=${{ steps.tags.outputs.tag }}
            DPP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
