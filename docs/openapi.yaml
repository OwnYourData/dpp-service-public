openapi: 3.0.3
info:
  title: Digital Product Passport (DPP) Service API
  description: >-
    REST/HTTPS API for the Digital Product Passport, following the
    CEN/CENELEC JTC 24 standards in their published 2026 editions:
      * EN 18222:2026 — APIs for the product passport lifecycle management
        (endpoints, HTTP verbs, parameters, status codes — Tables 1–19)
      * EN 18223:2026 — System interoperability (payload / semantic data model)
      * EN 18216:2026 — Data exchange protocols (TLS, JSON/XML/JSON-LD/HTML, error handling)
      * EN 18239:2026 — Access rights, information security, business confidentiality
      * EN 18246:2026 — Data authentication, reliability and integrity
        (payload hash and operator signature, docs/Integrity.md)
      * EN 18219:2026 — Unique identifiers (incl. W3C DIDs — the scheme used here is did:oyd)

    The standards name abstract methods and stay technology-neutral; this
    specification is one concrete REST realisation of them. Each operation that
    realises a method of EN 18222:2026 names it in `x-semanticId`; the base URI
    `https://jtc24/...` of these values is a placeholder, not a resolvable
    identifier.

    IDENTIFIERS IN PATHS: `dpp_id` and `product_id` are URIs/URLs (EN 18219:2026)
    and contain `:`, `/` and `.`. They MUST be percent-encoded into a single
    path segment, e.g.
    `https://dpp.example.org/01/09520123456788/8546` becomes
    `https%3A%2F%2Fdpp.example.org%2F01%2F09520123456788%2F8546`.
    The service disables content-type suffix routing (`.json`), so dots inside
    an identifier are preserved.
  version: 0.2.0
  contact:
    name: DPP Service (OwnYourData)
  license:
    name: Proprietary
servers:
  - url: https://api.example.org/dpp/v1
    description: >-
      DPP Service, operated by OwnYourData. The payload is optionally held by a
      custodian (a data intermediary), never by this service in that case.
      HTTPS/TLS 1.3 required.

tags:
  - name: Life Cycle API
    description: Core methods (EN 18222:2026, Clause 4) — read/create/update/delete a DPP.
  - name: Registry API
    description: Registration of a DPP at the EC registry (EN 18222:2026, Clause 5).
  - name: Fine Granular Life Cycle API
    description: Access to individual data elements / collections (EN 18222:2026, Clause 6).
  - name: Custody
    description: >-
      Beyond EN 18222:2026. The standard says what a service does with a
      passport, not where it keeps it or on whose authority it reaches that
      store. These operations carry no `x-semanticId`, because the standard
      names no method they realise.
  - name: Access policies
    description: >-
      Beyond EN 18222:2026. Which access class (public, legitimateInterest,
      authority) each attribute of a passport belongs to, registered once per
      product type (docs/AccessClasses.md). Nothing of a policy is part of the
      passport. These operations carry no `x-semanticId`.
  - name: Access grants
    description: >-
      Beyond EN 18222:2026. Who may read the controlled part of which passports
      in which access classes (docs/AccessClasses.md §7). These operations carry
      no `x-semanticId`.
  - name: Access log
    description: >-
      Beyond EN 18222:2026. Who read what of the controlled part of passports,
      who was refused, and which access grants were registered and revoked
      (docs/AccessClasses.md §10). This operation carries no `x-semanticId`.

security:
  - bearerAuth: []   # Public read data is accessible unauthenticated (EN 18239:2026 6.1); controlled data requires a token.

paths:
  ###########################################################################
  # 4  Life Cycle API (Main Methods)
  ###########################################################################
  /dpps:
    post:
      tags: [Life Cycle API]
      summary: CreateDPP
      description: >-
        Creates a new DPP. Access rules control whether creation is allowed (EN 18222:2026 4.6, Table 5).
        A product has at most one active passport: if one already exists for the same
        uniqueProductIdentifier (host compared without regard to case), the request is
        refused with 409 ClientResourceConflict and nothing is created. A unique database
        index over active passports holds this for concurrent requests as well.
        With an access policy (`X-DPP-Access-Policy`) and a custodian that holds
        controlled cards, the passport is written as a public and a controlled
        card (docs/AccessClasses.md §6); on a custodian that does not, a policy
        that leaves attributes not public is refused with 400, and so it is at a
        collection for which the custodian has not entered this service as
        reader (message code `readerNotEntered`), before anything is written.
        The custodian's
        refusals of a card are answered with 409 (identifier held in a
        collection of another economic operator, or the cards of the passport do
        not match) and 403 (delegation does not cover the controlled card). The
        answer is the whole passport.
      operationId: createDPP
      x-semanticId: https://jtc24/dpp/API/CreateDPP/1/0
      parameters:
        - $ref: '#/components/parameters/RetainUntil'
        - $ref: '#/components/parameters/AccessPolicy'
        - $ref: '#/components/parameters/Representation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalProductPassport'
      responses:
        '201':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Retain-Until:
              description: The availability period as stored, echoed when one was given.
              schema: { type: string, format: date }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Policy: { $ref: '#/components/headers/AccessPolicy' }
            X-DPP-Request-Binding: { $ref: '#/components/headers/RequestBinding' }
          description: SuccessCreated — DPP created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalProductPassport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dpps/{dppId}:
    parameters:
      - $ref: '#/components/parameters/DppId'
    get:
      tags: [Life Cycle API]
      summary: ReadDPPById
      description: >-
        Returns the DPP with the specified DPP ID (EN 18222:2026 4.2, Table 1).
        For a passport held as a public and a controlled part
        (docs/AccessClasses.md §6) a reader without access rights gets the
        public part, which names the controlled one in the data element
        `ControlledData`. A reader with access rights -- the owner, or a reader
        DID holding an access grant -- presents its bearer token and gets in
        addition the attributes of the classes it may read (§8). A token that is
        presented but does not hold is answered with 401. If the custodian does
        not accept this service as reader of the passport's collection, a reader
        with access rights gets the public part with
        `X-DPP-Controlled-Part: unavailable;reason=readerNotEntered`. The same
        holds for every read method.
      operationId: readDPPById
      x-semanticId: https://jtc24/dpp/API/ReadDPPById/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Roles: { $ref: '#/components/headers/AccessRoles' }
            X-DPP-Controlled-Part: { $ref: '#/components/headers/ControlledPart' }
          description: Success — requested DPP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalProductPassport' }
            application/jose:
              schema: { $ref: '#/components/schemas/OperatorSignature' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Life Cycle API]
      summary: UpdateDPPById
      description: >-
        Partial update of a DPP, conformant to RFC 7396 (JSON Merge Patch).
        The submitted DPP contains only the data that needs to be updated or added.
        If any part fails, the complete update fails and no changes are adopted.
        All changes are archived per EN 18221:2026 4.2 (EN 18222:2026 4.7, Table 6).
      operationId: updateDPPById
      x-semanticId: https://jtc24/dpp/API/UpdateDPPById/1/0
      parameters:
        - $ref: '#/components/parameters/AccessPolicy'
        - $ref: '#/components/parameters/Representation'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/DigitalProductPassport'
            example:
              dppStatus: "Archived"
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Policy: { $ref: '#/components/headers/AccessPolicy' }
            X-DPP-Request-Binding: { $ref: '#/components/headers/RequestBinding' }
          description: Success — updated DPP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalProductPassport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Life Cycle API]
      summary: DeleteDPPById
      description: >-
        Removes the DPP with the specified DPP ID (end of life). Access rules apply (EN 18222:2026 4.8, Table 7).
        A passport created with X-DPP-Retain-Until is refused with 403 ClientForbidden up to and
        including that day, whoever asks (ESPR Art. 9(2)(i)).
      operationId: deleteDPPById
      x-semanticId: https://jtc24/dpp/API/DeleteDPPById/1/0
      responses:
        '204':
          description: SuccessNoContent — DPP deleted.
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dpps/{dppId}/custody:
    parameters:
      - $ref: '#/components/parameters/DppId'
      - $ref: '#/components/parameters/DppStorage'
    post:
      tags: [Custody]
      summary: Change the custodian
      description: >-
        Hands a pod-backed passport to the custodian named by the mandate in
        `X-DPP-Storage`: the service reads the document from the custodian that
        still holds it, writes it to the new one and repoints the passport. No
        identifier changes — neither `digitalProductPassportId` nor
        `uniqueProductIdentifier`, which is what a carrier bears.

        The previous custodian keeps serving unless `release_previous` is set;
        the overlap is the rollback path while printed carriers may still
        resolve to the old host.

        Goes beyond EN 18222:2026, which names no method for it.
      operationId: moveCustody
      parameters:
        - name: release_previous
          in: query
          required: false
          description: End custody at the previous pod in the same call (soft delete).
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          description: Success — the passport, unchanged, at its new custodian.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalProductPassport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /dpps/{dppId}/delegation:
    parameters:
      - $ref: '#/components/parameters/DppId'
    get:
      tags: [Custody]
      summary: Read the delegation in place
      description: >-
        Says which mandate the service currently holds for this passport, so
        that the holder's own record of it can be checked against the service's
        state — after a restore from an older backup the two drift apart, and
        the drift is otherwise silent.

        The claims are reported as stored, without being verified: an expired
        or otherwise unusable mandate is what the caller is here to find out
        about. All five values were signed by the owner, who is the only one
        allowed to read them.

        Every value is `null` when the stored mandate cannot be read at all —
        the service then holds nothing it could redeem.

        Goes beyond EN 18222:2026, which names no method for it.
      operationId: readDelegation
      responses:
        '200':
          description: Success — the mandate in place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationState' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            ClientErrorResourceNotFound — no such passport, or one that is not
            held by a custodian and therefore has no delegation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
    post:
      parameters:
        - $ref: '#/components/parameters/DppStorage'
      tags: [Custody]
      summary: Renew the delegation
      description: >-
        Replaces the mandate under which the service reaches the custodian that
        holds this passport, without moving the passport. A mandate has a
        lifetime (docs/Delegation.md §10) and a passport does not.

        The mandate must name the same custodian and collection as the one in
        place — a different one is a handover, `POST /dpps/{dppId}/custody`. It
        must name this passport's `uniqueProductIdentifier`, cover at least what
        the stored mandate covers, and expire later than it does. The service
        obtains a token with it before the stored mandate is replaced.

        The stored mandate is not required to be valid; the ordinary reason to
        call this is that it has expired.

        Goes beyond EN 18222:2026, which names no method for it.
      operationId: renewDelegation
      responses:
        '204':
          description: >-
            SuccessNoContent — the fresh mandate is in place. No body: the
            passport is untouched, and the mandate was signed by the caller.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /dpps/{dppId}/access-policy:
    parameters:
      - $ref: '#/components/parameters/DppId'
    get:
      tags: [Access policies]
      summary: Read the warnings of the passport's access policy
      description: >-
        Lists, for the passport as it stands, the attributes no rule of its
        access policy reaches (they take the policy's default) and the rules
        that reach no attribute. The response header of a write gives the
        counts; this gives the paths. For the owner only.
      operationId: readAccessPolicyWarnings
      responses:
        '200':
          description: Success — the warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessPolicyWarnings' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            ClientErrorResourceNotFound — no such passport, or no access policy
            attached to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /dpps/{dppId}/signature:
    parameters:
      - $ref: '#/components/parameters/DppId'
    put:
      tags: [Life Cycle API]
      summary: Sign the passport as its economic operator
      description: >-
        Not part of EN 18222:2026. The owner of a passport this service holds
        in its own database submits a JWS in the compact serialization over the
        public part of the passport in the full representation, as a reader
        without access rights receives it, signed with the document key of its
        DID (`kid` `<DID>#key-doc`, `alg` `EdDSA`). The service checks the
        signature against the DID as resolved and the payload against the
        passport as delivered now (compared as JSON), and keeps it; it never
        signs itself. Every write discards the signature again. If the signer
        is not the `economicOperatorId` of the passport, the signature is
        accepted and the answer carries a message of type `Warning`
        (docs/Integrity.md section 10).
      operationId: signDPP
      requestBody:
        required: true
        content:
          application/jose:
            schema: { $ref: '#/components/schemas/OperatorSignature' }
      responses:
        '200':
          headers:
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
          description: Success — signature accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '400':
          description: >-
            ClientErrorBadRequest — not a compact JWS with that header, a
            signature that does not verify, a payload that is not the passport
            as delivered now (fetch it again and sign that), or a passport held
            by a custodian.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403':
          description: >-
            ClientForbidden — the bearer token or the `kid` names another DID
            than the owner of the passport, or bearer tokens are not verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-policies:
    put:
      tags: [Access policies]
      summary: Register an access policy
      description: >-
        Registers the access policy of a product type for the economic operator
        that presents the token. Passports name it by its `id` in
        `X-DPP-Access-Policy`. A registered policy never changes: registering
        the same policy again is answered with 200, a different policy under a
        registered `id` with 409, and a new version of a policy is registered
        under a new `id`. Members and rules may come in any order. Another
        operator using the same `id` has a policy of its own.
      operationId: registerAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessPolicy' }
      responses:
        '200':
          description: Success — the same policy was registered before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessPolicy' }
        '201':
          description: SuccessCreated — the policy is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '409':
          description: >-
            ClientResourceConflict — a different policy is registered under
            this `id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /access-grants:
    put:
      tags: [Access grants]
      summary: Register an access grant
      description: >-
        Registers an access grant (docs/AccessClasses.md §7): a statement of
        type `dpp-access-grant+jwt`, signed by its issuer, that a reader DID may
        read the controlled part of passports in the access classes it names.
        The body is the grant as it is; the bearer token is the issuer's. An
        economic operator grants `legitimateInterest` for its own passports;
        `authority` is taken only from the issuers listed under
        `authorityIssuers` in `/.well-known/dpp-service`.
      operationId: registerAccessGrant
      requestBody:
        required: true
        content:
          application/jwt:
            schema: { type: string }
      responses:
        '200':
          description: Success — this grant was registered before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '201':
          description: SuccessCreated — the grant is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403':
          description: >-
            ClientForbidden — the token is not the issuer's, or the issuer may
            not grant this: `authority` from an issuer not on the list, or
            passports of another owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '409':
          description: >-
            ClientResourceConflict — a different grant of this issuer is
            registered under the same `jti`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
    get:
      tags: [Access grants]
      summary: List the access grants one has issued
      description: >-
        The grants the presenting DID has issued, with their claims and whether
        they are revoked; not the signed statements.
      operationId: listAccessGrants
      responses:
        '200':
          description: Success — the grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccessGrant' }
        '401': { $ref: '#/components/responses/NotAuthorized' }

  /access-grants/{jti}:
    parameters:
      - name: jti
        in: path
        required: true
        description: The name of the grant, as its issuer signed it.
        schema: { type: string }
    delete:
      tags: [Access grants]
      summary: Revoke an access grant
      description: >-
        Revokes a grant the presenting DID has issued, with effect from now:
        the next read under it gets the public part only, and is logged as
        refused. A revoked grant stays revoked; registering it again answers
        200 with `revoked: true`. Revoking is logged (docs/AccessClasses.md
        §7, §10).
      operationId: revokeAccessGrant
      responses:
        '200':
          description: Success — the grant is revoked, now or before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '404':
          description: >-
            ClientErrorResourceNotFound — the presenting DID has issued no
            grant under this `jti`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /access-log:
    get:
      tags: [Access log]
      summary: Read the entries of the access log that concern you
      description: >-
        The entries that concern the presenting DID, newest first: as owner of
        passports, every access to them and every read the service made at a
        custodian for them; as reader, its own accesses; as issuer of access
        grants, its grants registered and revoked and the reads made under
        them (docs/AccessClasses.md §10). Never content, never tokens.
      operationId: readAccessLog
      parameters:
        - { name: dppId, in: query, schema: { type: string }, description: Only entries of this passport. }
        - name: event
          in: query
          schema: { $ref: '#/components/schemas/AccessEventType' }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: after, in: query, schema: { type: string }, description: The `next` of the previous page. }
      responses:
        '200':
          description: Success — a page of entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AccessEvent' }
                  next:
                    type: string
                    description: Cursor for the next page; absent on the last page.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '403':
          description: ClientForbidden — tokens are not verified on this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /dppsByProductId/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Life Cycle API]
      summary: ReadDPPByProductId
      description: Returns the current active DPP (latest version) for the given product ID (EN 18222:2026 4.3, Table 2).
      operationId: readDPPByProductId
      x-semanticId: https://jtc24/dpp/API/ReadDPPByProductId/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Roles: { $ref: '#/components/headers/AccessRoles' }
            X-DPP-Controlled-Part: { $ref: '#/components/headers/ControlledPart' }
          description: Success — latest active DPP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalProductPassport' }
            application/jose:
              schema: { $ref: '#/components/schemas/OperatorSignature' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dppsByIdAndDate/{dppId}:
    parameters:
      - $ref: '#/components/parameters/DppId'
      - name: date
        in: query
        required: true
        description: UTC timestamp for which the DPP version is requested.
        schema:
          type: string
          format: date-time
    get:
      tags: [Life Cycle API]
      summary: ReadDPPVersionByIdAndDate
      description: >-
        Returns the DPP version valid at the given date (EN 18222:2026 4.4,
        Table 3 and Table 16). Optional for the economic operator. Each reader
        gets the same classes as for the current passport; every version is
        filtered by the passport's access policy as it is today
        (docs/AccessClasses.md §9); a reader without access rights gets the
        public part kept with the version as long as that policy is the one the
        version had. With `Accept: application/jose` and `representation=full`
        the answer is the signature of the economic operator kept with the
        version, where its payload is exactly the JSON the same request gets
        (docs/Integrity.md section 10). If the custodian serves no versions of
        controlled cards, a reader with access rights gets the public part of
        the version with
        `X-DPP-Controlled-Part: unavailable;reason=versionsNotServed`.
      operationId: readDPPVersionByIdAndDate
      x-semanticId: https://jtc24/dpp/API/ReadDPPVersionByIdAndDate/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          headers:
            X-DPP-Access-Roles: { $ref: '#/components/headers/AccessRoles' }
            X-DPP-Controlled-Part: { $ref: '#/components/headers/ControlledPart' }
            X-DPP-Signature-State:
              description: >-
                `signed` where a signature of the economic operator kept with the
                version covers exactly this answer, `none` otherwise.
              schema: { type: string, enum: [signed, none] }
          description: Success — DPP version for the given date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalProductPassport' }
            application/jose:
              schema: { $ref: '#/components/schemas/OperatorSignature' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dppsByProductIds:
    post:
      tags: [Life Cycle API]
      summary: ReadDPPIdsByProductIds
      description: >-
        Returns the identifiers of all DPPs whose product identifier is one of the
        supplied set (the union: a DPP carries exactly one product identifier).
        Supports cursor pagination (EN 18222:2026 4.5, Table 4).
      operationId: readDPPIdsByProductIds
      x-semanticId: https://jtc24/dpp/API/ReadDPPIdsByProductIds/1/0
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum size of the result set (1 to 1000, default 100).
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          required: false
          description: Position from which to resume a result listing (shall not be empty).
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: >-
                Set of product identifiers (Table 4: productId, Identifier[], 1..*),
                either as a bare JSON array or as an object whose only member is
                productId. Identifiers are non-empty strings; any other body is
                answered with 400. At most 1000 identifiers per request, as many as
                the largest page holds (configurable, `DPP_MAX_PRODUCT_IDS`); more
                are answered with 400.
              oneOf:
                - type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, minLength: 1 }
                - type: object
                  required: [productId]
                  additionalProperties: false
                  properties:
                    productId:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items: { type: string, minLength: 1 }
            examples:
              array:
                value: ["https://dpp.oydapp.eu/01/09520123456788/21/000001"]
              object:
                value: { productId: ["https://dpp.oydapp.eu/01/09520123456788/21/000001"] }
      responses:
        '200':
          description: Success — matching DPP identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [payload]
                properties:
                  payload:
                    type: array
                    items: { $ref: '#/components/schemas/Identifier' }
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor to fetch the next page, or null if no further results.
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  ###########################################################################
  # 5  Registry API for Register
  ###########################################################################
  /registerDPP:
    post:
      tags: [Registry API]
      summary: RegisterProductDPP
      description: >-
        Registers a new DPP at the EU registry by supplying a dppRegistryEntry
        (EN 18222:2026 5.2, Table 8 and Table 17).
        This deployment is not connected to the EU DPP Registry. A complete
        entry is answered with 502 ServerErrorBadGateway (message code
        `registryNotConnected`); nothing is registered and no registration
        identifier is returned.
      operationId: registerProductDPP
      x-semanticId: https://jtc24/dpp/API/RegisterProductDPP/1/0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryRegistration' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }

  ###########################################################################
  # 6  Fine Granular API Operations of the Life Cycle API
  ###########################################################################
  /dpps/{dppId}/collections/{elementId}:
    parameters:
      - $ref: '#/components/parameters/DppId'
      - name: elementId
        in: path
        required: true
        description: Collection identifier within the DPP.
        schema: { $ref: '#/components/schemas/Identifier' }
    get:
      tags: [Fine Granular Life Cycle API]
      summary: ReadDataElementCollection
      description: >-
        Returns a specific DataElementCollection used within a DPP. Beyond the
        published method set: EN 18222:2026 Table 18 defines ReadDataElement and
        UpdateDataElement only, a collection being a DataElement subclass
        (EN 18223:2026 4.1.2.4). Kept because addressing a collection directly
        is what clients asked for.
      operationId: readDataElementCollection
      x-semanticId: https://jtc24/dpp/API/ReadDataElementCollection/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
          description: Success — requested DataElementCollection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataElementCollection' }
        '401':
          description: >-
            ClientNotAuthorized — read without a bearer token on an element path the
            passport's access policy does not make public, whether the element
            exists or not (docs/AccessClasses.md §8), or with a token that does not
            hold. A public path that leads nowhere is 404.
          headers:
            WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '403':
          description: >-
            ClientForbidden — read with a valid bearer token on an element path
            beyond the access classes the reader holds for this passport, whether
            the element exists or not (docs/AccessClasses.md §8). A path within them
            that leads nowhere is 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Fine Granular Life Cycle API]
      summary: UpdateDataElementCollection
      description: >-
        Updates a DataElementCollection (partial, RFC 7396). If any part fails,
        the complete update fails. Beyond the published method set, see
        ReadDataElementCollection. The passport's access policy stays as it is;
        a request with `X-DPP-Access-Policy` is answered with 400.
      operationId: updateDataElementCollection
      x-semanticId: https://jtc24/dpp/API/UpdateDataElementCollection/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/DataElementCollection' }
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Policy: { $ref: '#/components/headers/AccessPolicy' }
            X-DPP-Request-Binding: { $ref: '#/components/headers/RequestBinding' }
          description: Success — updated DataElementCollection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataElementCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dpps/{dppId}/elements/{elementPath}:
    parameters:
      - $ref: '#/components/parameters/DppId'
      - name: elementPath
        in: path
        required: true
        description: >-
          elementIdPath (EN 18222:2026 8.1): an RFC 9535 JSONPath singular query
          over the element identifiers, percent-encoded in the URL, e.g.
          `$.EnergyPerformance.LuminousFlux` or
          `$['EnergyPerformance']['LuminousFlux']`; an index selects an item of a
          multi-valued element (`$.efficiencyRatings[0]`). The element identifiers
          separated by "/" (`EnergyPerformance/LuminousFlux`) address the same
          element. A query that is not RFC 9535 syntax, or that can select more than
          one element (wildcard, descendant, slice, filter), is answered with 400.
        schema: { type: string }
        example: "$.EnergyPerformance.LuminousFlux"
    get:
      tags: [Fine Granular Life Cycle API]
      summary: ReadDataElement
      description: >-
        Returns a specific data element by its absolute path (EN 18222:2026 6.2,
        Table 18). The path is evaluated on the compressed form. In the compressed
        representation the answer is the JSON value the path selects in the
        compressed passport: a single value as a bare JSON value (`806`,
        `"LUM-A60-827-806"`), a collection as an object, a multi-valued element as
        an array. In the full representation it is the element object of
        EN 18223:2026 Annex A, with `elementId`, `objectType` and its metadata.
      operationId: readDataElement
      x-semanticId: https://jtc24/dpp/API/ReadDataElement/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Access-Roles: { $ref: '#/components/headers/AccessRoles' }
            X-DPP-Controlled-Part: { $ref: '#/components/headers/ControlledPart' }
          description: Success — requested data element.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataElement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            ClientNotAuthorized — read without a bearer token on an element path the
            passport's access policy does not make public, whether the element
            exists or not (docs/AccessClasses.md §8), or with a token that does not
            hold. A public path that leads nowhere is 404.
          headers:
            WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '403':
          description: >-
            ClientForbidden — read with a valid bearer token on an element path
            beyond the access classes the reader holds for this passport, whether
            the element exists or not (docs/AccessClasses.md §8). A path within them
            that leads nowhere is 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Fine Granular Life Cycle API]
      summary: UpdateDataElement
      description: >-
        Updates, enhances or removes a specific data element within a DPP
        (EN 18222:2026 6.3, Table 18). The passport's access policy stays as it
        is; a request with `X-DPP-Access-Policy` is answered with 400.
      operationId: updateDataElement
      x-semanticId: https://jtc24/dpp/API/UpdateDataElement/1/0
      parameters:
        - $ref: '#/components/parameters/Representation'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/DataElement' }
      responses:
        '200':
          headers:
            X-DPP-Payload-Hash: { $ref: '#/components/headers/PayloadHash' }
            X-DPP-Commit-State: { $ref: '#/components/headers/CommitState' }
            X-DPP-Signature-State: { $ref: '#/components/headers/SignatureState' }
            X-DPP-Access-Policy: { $ref: '#/components/headers/AccessPolicy' }
            X-DPP-Request-Binding: { $ref: '#/components/headers/RequestBinding' }
          description: Success — updated data element.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataElement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  ###########################################################################
  # Security (EN 18239:2026 + EN 18216:2026: OAuth 2.0 / OpenID Connect, JWT bearer)
  ###########################################################################
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Self-issued JWT, signed with the document key of the presenter's DID,
        with this service as `aud` (EN 18239:2026), a `jti`, and an `exp` at
        most 15 minutes ahead. Each token is accepted once: the service records
        issuer and `jti` until the token expires and refuses the same pair
        after that, so a client mints one per request. The token of every
        request that changes something carries `rqh`, which binds it to that
        request: base64url(SHA-256(METHOD LF TARGET LF base64url(SHA-256(BODY)))),
        without padding, over the method in capitals, the request-target as in
        the request line (path and query, percent-encoding untouched) and the
        body bytes as sent. A token whose `rqh` names another request is refused
        with 401; one without `rqh` is accepted until the day set in
        `DPP_REQUEST_BINDING_FROM`, with `X-DPP-Request-Binding`, and refused
        from then on. The service keeps the token of every write in its write
        log (docs/Integrity.md section 11). Public data is readable
        without authentication; the controlled part of a passport goes to its
        owner and to readers holding an access grant for it
        (docs/AccessClasses.md §7–§8).

  ###########################################################################
  # Payload commitment (EN 18246:2026; docs/Integrity.md)
  ###########################################################################
  headers:
    RequestBinding:
      description: >-
        Sent with a write whose token carries no `rqh`, while such writes are
        still accepted: `missing;until="<date>"`, the day from which they are
        refused (docs/Integrity.md section 11).
      schema: { type: string, example: 'missing;until="2026-12-01"' }
    WWWAuthenticate:
      description: >-
        The authentication scheme, sent with every 401 (RFC 9110 15.5.2): `Bearer`
        without a token, `Bearer error="invalid_token"` for a token that was
        presented and refused (RFC 6750 3.1).
      schema: { type: string, example: Bearer }
    PayloadHash:
      description: >-
        The hash of the payload as the custodian delivers it — sha2-256,
        multibase-encoded, formed over the bytes returned by the
        `serviceEndpoint` of the DID document without any canonicalisation. It is
        the value the DID document commits to, or the value it is expected to
        commit to while the state is `pending`. Absent for a passport that has
        never been through a commitment.
      schema: { type: string, example: zQme9xtkmy2wFUjDtSAZvGTuxmgbXXi6Ws5LDqf2uyy3S6h }
    CommitState:
      description: >-
        `committed` — the DID document commits to the payload as delivered now.
        `pending` — the hash is known, the signed log entry is not written; the
        normal state where the holder keeps the document key. Such a passport is
        re-checked when it is read, at most once per minute, so the state moves to
        `committed` on its own once the holder has published the entry.
        `stale` — the commitment refers to an earlier payload.
        A header rather than a field of the document, so the payload stays free
        of proprietary attributes (EN 18223:2026 Table 1) — the same reason
        `X-DPP-Storage` is a header. A write is never refused because a
        commitment is outstanding; the state is reported instead.
      schema: { type: string, enum: [committed, pending, stale] }
    SignatureState:
      description: >-
        The signature of the economic operator over the public part of the
        passport (docs/Integrity.md section 10). `none` — never signed.
        `pending` — written after the last signature, which is discarded; a new
        one is expected. `signed` — accepted, and it still verified at the last
        check. `stale` — it no longer verifies (the key of the DID changed, or
        the DID is revoked or cannot be resolved) and is not delivered. The
        read paths hand out the JWS with `Accept: application/jose` only when it
        covers exactly the JSON the same request would get: with
        `representation=full` and to a reader without access classes applied.
      schema: { type: string, enum: [none, pending, signed, stale] }
    AccessPolicy:
      description: >-
        On a write of the owner on a passport with an access policy: the policy
        and how well it fits the passport as it now stands, as an RFC 8941 item.
        `unclassified` counts the attributes no rule reaches (they take the
        policy's default), `unused-rules` the rules that reach no attribute.
        The paths are listed by `GET /dpps/{dppId}/access-policy`. Read paths
        never carry this header.
      schema:
        type: string
        example: '"https://dpp.example.org/access-policies/led-lamp/1";unclassified=1;unused-rules=1'
    AccessRoles:
      description: >-
        On a read with access rights: the access classes beyond `public` that
        were applied. Such an answer also carries `Cache-Control: private,
        no-store`. Every answer of a read path carries `Vary: Authorization`.
      schema: { type: string, example: legitimateInterest }
    ControlledPart:
      description: >-
        `unavailable` — the reader's access rights reach further than what could
        be read, so the answer holds the public part only. An RFC 8941 item;
        the parameter `reason` says why: `readerNotEntered`, the custodian does
        not accept this service as reader of the passport's collection;
        `versionsNotServed`, the custodian serves no versions of controlled
        cards (ReadDPPVersionByIdAndDate). Such an answer carries
        `Cache-Control: private, no-store`.
      schema: { type: string, example: 'unavailable;reason=readerNotEntered' }

  parameters:
    DppId:
      name: dppId
      in: path
      required: true
      description: The DPP's globally unique identifier.
      schema: { $ref: '#/components/schemas/Identifier' }
    ProductId:
      name: productId
      in: path
      required: true
      description: The product identifier (enables a web link to the DPP).
      schema: { $ref: '#/components/schemas/Identifier' }
    DppStorage:
      name: X-DPP-Storage
      in: header
      required: true
      description: >-
        The custodian and the mandate to reach it, as JSON or the same object
        base64url-encoded (docs/Delegation.md §9):
        `{"base_url": "...", "collection_id": "...", "delegation": "<JWT>"}`.
        A header rather than a field of the document, so the payload stays free
        of proprietary attributes (EN 18223:2026). The delegation is a JWT the
        economic operator signed for exactly this service, this pod and this
        product.
      schema: { type: string }
    RetainUntil:
      name: X-DPP-Retain-Until
      in: header
      required: false
      description: >-
        The last day the passport has to stay available (ESPR Art. 9(2)(i)), as
        the economic operator worked it out from its product group's rules.
        Until that day DeleteDPPById is refused. A header and not a field of the
        document, because EN 18223:2026 Table 1 defines no such attribute.
        Anything that is not a date is answered with 400.
      schema: { type: string, format: date, example: '2037-03-01' }
    AccessPolicy:
      name: X-DPP-Access-Policy
      in: header
      required: false
      description: >-
        The `id` of an access policy the presenting economic operator has
        registered with `PUT /access-policies`. On CreateDPP it attaches the
        policy to the new passport; on UpdateDPP it replaces the passport's
        policy, also with the merge patch `{}`. A policy cannot be removed, so
        the header cannot be empty. An empty header, an `id` this operator has
        not registered, or a passport the policy cannot classify is answered
        with 400 before anything is changed. Without the header nothing about
        the policy changes.
      schema:
        type: string
        example: https://dpp.example.org/access-policies/led-lamp/1
    Representation:
      name: representation
      in: query
      required: false
      description: >-
        EN 18222:2026 8.1. `compressed` (the default) answers with the compressed
        serialization of EN 18223:2026 5.2: the header attributes, then every data
        element as a member named by its elementId, without the metadata a data
        dictionary carries (`objectType`, `dictionaryReference`, `valueDataType`
        and further attributes of a value). `full` answers with the expanded
        serialization of EN 18223:2026 Annex A, the data elements in `elements`.
        Any other value, including other capitalisations, is answered with 400
        ClientErrorBadRequest. Request bodies are not affected: a merge patch
        always applies to the full form.
      schema: { type: string, enum: [compressed, full], default: compressed }

  ###########################################################################
  # Reusable error responses (EN 18222:2026 7.2, Tables 12-15)
  ###########################################################################
  responses:
    BadRequest:
      description: ClientErrorBadRequest — bad or malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    NotAuthorized:
      description: ClientNotAuthorized — wrong or missing authorization credentials.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    Forbidden:
      description: ClientForbidden — authorization refused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    NotFound:
      description: ClientErrorResourceNotFound — resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    Conflict:
      description: ClientResourceConflict — resource already exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    InternalError:
      description: ServerInternalError — unexpected error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }
    BadGateway:
      description: ServerErrorBadGateway — bad gateway.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Result' }

  ###########################################################################
  # Schemas
  ###########################################################################
  schemas:
    OperatorSignature:
      type: string
      description: >-
        A JWS in the compact serialization (RFC 7515) whose payload is the
        public part of the passport in the full representation, signed by the
        economic operator with the document key of its DID.
      example: eyJhbGciOiJFZERTQSIsImtpZCI6ImRpZDpveWQ6elFt4oCmI2tleS1kb2MifQ.eyJkaWdpdGFsUHJvZHVjdFBhc3Nwb3J0SWQiOiLigKYifQ.c2lnbmF0dXJl
    Identifier:
      type: string
      description: Globally unique identifier; SHOULD be a URI/URL (see EN 18219:2026, incl. W3C DID schemes).
      example: "https://dpp.example.org/01/09520123456788/21/12345"

    # ---- EN 18222:2026 7.2: Status / Result / Message --------------------
    StatusCode:
      type: string
      description: Generic status code of the response (EN 18222:2026 Table 15).
      enum:
        - Success
        - SuccessCreated
        - SuccessAccepted
        - SuccessNoContent
        - ClientErrorBadRequest
        - ClientNotAuthorized
        - ClientForbidden
        - ClientMethodNotAllowed
        - ClientErrorResourceNotFound
        - ClientResourceConflict
        - ServerInternalError
        - ServerErrorBadGateway
    MessageTypeEnum:
      type: string
      enum: [Info, Warning, Error, Exception]
      description: The message type (EN 18222:2026 Table 14).
    Message:
      type: object
      description: A message with more information for the requester (EN 18222:2026 Table 13).
      required: [messageType, text]
      properties:
        messageType: { $ref: '#/components/schemas/MessageTypeEnum' }
        text: { type: string }
        code:
          type: string
          description: >-
            Technology-dependent status or error code, in camelCase. This
            service sets `readerNotEntered` on the 400 of a write to a
            collection for which the custodian has not entered this service as
            reader, and `registryNotConnected` on the 502 of
            RegisterProductDPP.
        correlationId:
          type: string
          description: Identifier to relate several result messages across systems.
        timestamp:
          type: string
          format: date-time
    DelegationState:
      type: object
      description: >-
        The delegation the service holds for a passport, reported as stored
        (docs/Delegation.md §11). Not part of any standard.
      properties:
        jti:
          type: string
          nullable: true
          description: The mandate's name, and the handle its issuer revokes it by.
          example: "b2f1c9e4a7d05386"
        exp:
          type: integer
          nullable: true
          description: Expiry as a POSIX timestamp, as signed.
          example: 1794736000
        act:
          type: array
          nullable: true
          items: { type: string }
          description: The operations the mandate covers.
          example: ["create", "update", "delete"]
        collection:
          type: string
          nullable: true
          example: "4"
        base_url:
          type: string
          nullable: true
          description: The custodian the mandate is addressed to (its `aud` claim).
          example: "https://dpp.go-data.at"

    AccessPolicy:
      type: object
      description: >-
        An access policy (docs/AccessClasses.md; JSON Schema
        config/vocab/access-policy.schema.json). Not part of any standard.
      required: [id, scheme, rules]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uri
          maxLength: 512
          description: Absolute URI in printable ASCII. A changed policy gets a new id.
          example: https://dpp.example.org/access-policies/led-lamp/1
        title: { type: string, example: LED lamp }
        scheme:
          type: string
          enum: ['https://w3id.org/soya/dpp-access/v1']
        default:
          type: string
          description: Class of an attribute no rule reaches; without it, `authority`.
          example: authority
        rules:
          type: array
          items:
            type: object
            required: [path, accessClass]
            additionalProperties: false
            properties:
              path:
                type: string
                description: Element identifiers from the top level down, separated by `/`.
                example: SubstancesOfConcern/MaterialComposition
              accessClass:
                type: string
                description: Notation or IRI of a class of https://w3id.org/soya/dpp-access/v1.
                example: legitimateInterest
    AccessPolicyWarnings:
      type: object
      description: How well a passport's access policy fits the passport. Not part of any standard.
      properties:
        policy:
          type: string
          description: The id of the passport's access policy.
          example: https://dpp.example.org/access-policies/led-lamp/1
        unclassified:
          type: array
          items: { type: string }
          description: Attributes no rule reaches; they take the policy's default.
          example: [Manufacturer]
        unusedRules:
          type: array
          items: { type: string }
          description: Paths of the rules that reach no attribute of the passport.
          example: [Recycling]

    AccessGrant:
      type: object
      description: >-
        A registered access grant, as its issuer signed it (docs/AccessClasses.md
        §7). Not part of any standard.
      properties:
        jti: { type: string, description: The name of the grant, unique per issuer. }
        sub: { type: string, description: The reader DID. }
        roles:
          type: array
          items: { type: string, enum: [legitimateInterest, authority] }
        scope: { type: string, enum: [dpps, issuer] }
        dpps:
          type: array
          items: { type: string }
          description: The passports the grant covers, when scope is dpps.
        purpose: { type: string }
        nbf: { type: integer, description: Valid from (seconds since the epoch). }
        exp: { type: integer, description: Valid until (seconds since the epoch). }
        revoked: { type: boolean }
        revokedAt: { type: integer, description: Revoked at (seconds since the epoch). }
        revokedBy: { type: string, description: The issuer's DID, or `operator`. }

    AccessEventType:
      type: string
      enum: [read, refused, integrityError, serviceRead, grantRegistered, grantRevoked]

    AccessEvent:
      type: object
      description: >-
        One entry of the access log (docs/AccessClasses.md §10). Not part of any
        standard. Fields that do not apply to an event are absent.
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        event: { $ref: '#/components/schemas/AccessEventType' }
        dppId: { type: string }
        owner: { type: string, description: Owner DID of the passport. }
        reader: { type: string, description: Verified DID of the reader. }
        roles:
          type: array
          items: { type: string }
          description: Access classes beyond public that were applied.
        basis: { type: string, enum: [owner, grant] }
        grants:
          type: array
          description: The grants read under, or the grant a refusal concerns.
          items:
            type: object
            properties: { iss: { type: string }, jti: { type: string } }
        operation: { type: string, example: ReadDPPById }
        date: { type: string, format: date-time, description: The date of ReadDPPVersionByIdAndDate. }
        status: { type: integer, description: HTTP status of the answer, or of the custodian for serviceRead. }
        reason:
          type: string
          description: >-
            refused: noGrant, revoked, expired, notYetValid, issuerNotListed;
            serviceRead: lookup, retry, version, measure, internal;
            grantRevoked: the operator's reason.
        custodian:
          type: object
          properties: { host: { type: string }, objectId: { type: string } }
        podPath: { type: string, description: The path read at the custodian. }
        controlledDigest: { type: string, description: ControlledData of the version handed out. }
        requestId: { type: string }
        issuer: { type: string, description: Issuer of the grant (grant events). }
        grant: { $ref: '#/components/schemas/AccessGrant' }
        revokedBy: { type: string }
        revocationReason: { type: string }

    Result:
      type: object
      description: Result object returned on failed method execution (EN 18222:2026 Table 12).
      properties:
        statusCode: { $ref: '#/components/schemas/StatusCode' }
        message:
          type: array
          items: { $ref: '#/components/schemas/Message' }

    # ---- EN 18223:2026 4.1: DPP semantic model ---------------------------
    DigitalProductPassport:
      type: object
      description: >-
        A Digital Product Passport instance (EN 18223:2026 Table 1), shown in the
        full representation. In the compressed representation (the default of
        every read, see the `representation` parameter) `elements` is replaced by
        one member per data element, named by its elementId (EN 18223:2026 5.2).
      required:
        - digitalProductPassportId
        - uniqueProductIdentifier
        - granularity
        - dppSchemaVersion
        - dppStatus
        - lastUpdated
        - economicOperatorId
      properties:
        digitalProductPassportId:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          description: >-
            Unique, globally unique identifier of the DPP instance (URI/URL).
            On CreateDPP this MAY be omitted: the service then mints a did:oyd
            (EN 18219:2026) and returns it as the dpp ID (Variante A).
        uniqueProductIdentifier:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          description: Unique product identifier that enables a web link to the DPP.
        granularity:
          type: string
          description: Level of granularity of the uniqueProductIdentifier as per ESPR.
          enum: [model, batch, item]
        dppSchemaVersion:
          type: string
          description: Reference standard/schema version the DPP instance refers to.
        dppStatus:
          type: string
          description: Status of the DPP instance as a digital resource.
          enum: [Active, Archived]
        lastUpdated:
          type: string
          format: date-time
          description: Date and time (UTC) of the latest update to the DPP instance.
        economicOperatorId:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          description: >-
            Identifier of an actor involved in the product's life cycle, formatted according to
            one of the ID schemes of EN 18219:2026 Clause 6: a DID (did:...), an ISO/IEC 6523
            identifier (ICD:identifier, e.g. 0199:<LEI>), a web address (https://...) or a DOI
            (10.<registrant>/<suffix>). CreateDPP answers anything else with 400.
        facilityId:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          description: Identifier of a location/building in the value chain (optional).
        elements:
          type: array
          description: >-
            The passport content in the expanded form of EN 18223:2026 Annex A:
            every level holds its children in `elements`.
          items: { $ref: '#/components/schemas/DataElement' }

    DataElement:
      description: >-
        A data element (EN 18223:2026 4.1.2.3). Abstract: realised as one of the
        concrete subclasses, discriminated by `objectType`. Every subclass
        inherits `elementId` and `dictionaryReference`.
      oneOf:
        - $ref: '#/components/schemas/DataElementCollection'
        - $ref: '#/components/schemas/SingleValuedDataElement'
        - $ref: '#/components/schemas/MultiValuedDataElement'
        - $ref: '#/components/schemas/RelatedResource'
      discriminator:
        propertyName: objectType
        mapping:
          DataElementCollection: '#/components/schemas/DataElementCollection'
          SingleValuedDataElement: '#/components/schemas/SingleValuedDataElement'
          MultiValuedDataElement: '#/components/schemas/MultiValuedDataElement'
          RelatedResource: '#/components/schemas/RelatedResource'

    DataElementCollection:
      type: object
      description: A collection of DataElements (EN 18223:2026 4.1.2.4).
      required: [objectType, elementId, elements]
      properties:
        objectType:
          type: string
          enum: [DataElementCollection]
        elementId:
          type: string
          description: >-
            Relative identifier, unique within its location; the absolute path
            is unique within the passport (EN 18223:2026 Table 2).
        dictionaryReference:
          type: string
          description: Reference to the data point specification in the data dictionary.
        elements:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DataElement' }

    SingleValuedDataElement:
      type: object
      description: A single data point with one value (EN 18223:2026 4.1.2.5, Table 3).
      required: [objectType, elementId, value]
      properties:
        objectType:
          type: string
          enum: [SingleValuedDataElement]
        elementId: { type: string }
        dictionaryReference: { type: string }
        value:
          description: The data value (any JSON datatype).
          nullable: true
        valueDataType:
          type: string
          description: XSD data type needed to interpret the value, e.g. "xsd:integer".
          example: xsd:integer
      additionalProperties: true
      # EN 18223:2026 Table 1 admits further content where relevant legal acts
      # require it. Attributes beyond the ones listed here -- unitOfMeasure in
      # the examples, for instance -- are the operator's content, not part of
      # the model.

    MultiValuedDataElement:
      type: object
      description: >-
        A list of objects of the same data type (EN 18223:2026 4.1.2.6,
        Table 4). Its members are DataElements, held in `elements` like every
        other level.
      required: [objectType, elementId, elements]
      properties:
        objectType:
          type: string
          enum: [MultiValuedDataElement]
        elementId: { type: string }
        dictionaryReference: { type: string }
        valueDataType: { type: string }
        elements:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DataElement' }

    RelatedResource:
      type: object
      description: >-
        A document or certificate included in the passport
        (EN 18223:2026 4.1.2.7, Table 5).
      required: [objectType, elementId, contentType, url]
      properties:
        objectType:
          type: string
          enum: [RelatedResource]
        elementId: { type: string }
        dictionaryReference: { type: string }
        contentType:
          type: string
          description: IANA media type.
          example: application/pdf
        url:
          type: string
          format: uri
        language:
          type: string
          description: Localized language tag, e.g. "en-GB".
        resourceTitle:
          type: string
          description: Human-readable title of the resource.

    # ---- EN 18222:2026 5.2 / 7.1: Registry registration payload ----------
    RegistryRegistration:
      type: object
      description: >-
        Request body of RegisterProductDPP. EN 18222:2026 7.1 Table 11 defines
        the dppRegistryEntry as the passport header.
      required: [dppRegistryEntry]
      properties:
        dppRegistryEntry: { $ref: '#/components/schemas/DppRegistryEntry' }

    DppRegistryEntry:
      type: object
      description: Passport header as registered (EN 18222:2026 7.1, Table 11).
      required: [uniqueProductIdentifier, uniqueEconomicOperatorIdentifier]
      properties:
        uniqueProductIdentifier: { $ref: '#/components/schemas/Identifier' }
        digitalProductPassportId: { $ref: '#/components/schemas/Identifier' }
        uniqueEconomicOperatorIdentifier: { $ref: '#/components/schemas/Identifier' }
        backupEconomicOperatorIdentifier:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          description: Operator hosting the back-up copy (EN 18221:2026 4.5).
        dppApiEndpoint:
          type: string
          format: uri
          description: Base URL of the API serving this passport.
